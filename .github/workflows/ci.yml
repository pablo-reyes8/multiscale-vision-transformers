name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install lint tools
        run: python -m pip install "ruff>=0.8,<1.0"
      - name: Ruff
        run: ruff check famous_vits tests vit_arena.py vit_arena_cli.py vit_arena_presets.py shared_dataset_zoo.py
      - name: Formatting
        run: ruff format --check famous_vits tests vit_arena.py vit_arena_cli.py vit_arena_presets.py shared_dataset_zoo.py

  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Test public API
        run: pytest tests --cov=famous_vits --cov-report=term-missing --cov-report=xml
      - name: Test architecture projects
        if: matrix.python-version == '3.12'
        run: |
          (cd model_zoo/ViT && pytest test)
          (cd model_zoo/HierarchicalViT && pytest test)
          (cd model_zoo/SwinViT && pytest test)
          (cd model_zoo/MaxViT && pytest tests)
          (cd model_zoo/Volo && pytest test)
      - name: Validate example pipelines
        run: |
          famous-vits validate-config --config configs/train_cifar100.yaml
          famous-vits validate-config --config configs/arena_cifar100.yaml
          famous-vits validate-config --config configs/analyze_cifar100.yaml
          famous-vits validate-config --config configs/smoke_test.yaml
      - name: YAML pipeline smoke test
        run: famous-vits run --config configs/smoke_test.yaml
      - name: Upload coverage
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage.xml

  build:
    needs: [lint, tests]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Build distributions
        run: |
          python -m pip install --upgrade pip build
          python -m build
          python -m pip install dist/*.whl
      - name: Inspect package
        working-directory: /tmp
        run: |
          python -m pip check
          python -c "from famous_vits import list_models; assert len(list_models()) == 8"
      - uses: actions/upload-artifact@v7
        with:
          name: distributions
          path: dist/*
