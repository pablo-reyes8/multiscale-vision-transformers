[project]
name = "famous-vision-transformers"
version = "0.1.0"
description = "From-scratch Vision Transformers with a unified timm-like PyTorch API"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = {text = "MIT"}
authors = [{name = "Pablo", email = "alejogranados229@gmail.com"}]
dependencies = [
    "torch>=2.2,<3.0",
    "torchvision>=0.17,<1.0",
    "numpy>=1.24,<3.0",
    "pillow>=10,<13",
    "matplotlib>=3.8,<4.0",
]

[project.optional-dependencies]
datasets = ["datasets>=2.18,<5.0"]
analysis = [
    "pandas>=2.2,<3.0",
    "scikit-learn>=1.3,<2.0",
    "seaborn>=0.13,<1.0",
    "scipy>=1.10,<2.0",
]
dev = [
    "build>=1.2,<2.0",
    "pytest>=7.4,<10.0",
    "pytest-cov>=5,<8.0",
    "ruff>=0.8,<1.0",
]

[project.scripts]
famous-vits = "famous_vits.cli:main"
vit-arena = "famous_vits.arena.cli:main"

[tool.poetry]
packages = [{include = "famous_vits"}]
include = [
    {path = "ViT/model", format = ["sdist", "wheel"]},
    {path = "HierarchicalViT/model", format = ["sdist", "wheel"]},
    {path = "SwinViT/model", format = ["sdist", "wheel"]},
    {path = "MaxViT/model", format = ["sdist", "wheel"]},
    {path = "MaxViT/model_configurations.py", format = ["sdist", "wheel"]},
    {path = "Volo/model", format = ["sdist", "wheel"]},
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = ["*.ipynb", "ViT", "HierarchicalViT", "SwinViT", "MaxViT", "Volo"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.coverage.run]
source = ["famous_vits"]
branch = true

[build-system]
requires = ["poetry-core>=2.0,<3.0"]
build-backend = "poetry.core.masonry.api"
