[project]
name = "famous-vision-transformers"
version = "0.1.0"
description = "From-scratch Vision Transformers with a unified timm-like PyTorch API"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = {text = "MIT"}
authors = [{name = "Pablo", email = "alejogranados229@gmail.com"}]
keywords = ["computer-vision", "deep-learning", "pytorch", "vision-transformer"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "torch>=2.13.0,<3.0",
    "torchvision>=0.28.0,<1.0",
    "numpy>=2.2.6,<3.0",
    "pillow>=12.3.0,<13",
    "matplotlib>=3.10.9,<4.0",
    "pyyaml>=6.0.3,<7.0",
]

[project.optional-dependencies]
datasets = ["datasets>=2.18,<5.0"]
analysis = [
    "pandas>=2.2,<3.0",
    "scikit-learn>=1.7.2,<2.0",
    "seaborn>=0.13.2,<1.0",
    "scipy>=1.10,<2.0",
]
research = [
    "einops>=0.7,<1.0",
    "jupyterlab>=4.0,<5.0",
    "timm>=0.9,<2.0",
    "tqdm>=4.66,<5.0",
]
dev = [
    "build>=1.5.0,<2.0",
    "pre-commit>=4.0,<5.0",
    "pytest>=9.1.1,<10.0",
    "pytest-cov>=5,<8.0",
    "ruff>=0.15.22,<1.0",
]

[project.scripts]
famous-vits = "famous_vits.cli:main"
vit-arena = "famous_vits.arena.cli:main"

[project.urls]
Homepage = "https://github.com/pablo-reyes8/multiscale-vision-transformers"
Repository = "https://github.com/pablo-reyes8/multiscale-vision-transformers"
Issues = "https://github.com/pablo-reyes8/multiscale-vision-transformers/issues"
Changelog = "https://github.com/pablo-reyes8/multiscale-vision-transformers/blob/main/CHANGELOG.md"

[tool.poetry]
packages = [{include = "famous_vits"}]
include = [
    {path = "model_zoo/ViT/model", format = ["sdist", "wheel"]},
    {path = "model_zoo/HierarchicalViT/model", format = ["sdist", "wheel"]},
    {path = "model_zoo/SwinViT/model", format = ["sdist", "wheel"]},
    {path = "model_zoo/MaxViT/model", format = ["sdist", "wheel"]},
    {path = "model_zoo/MaxViT/model_configurations.py", format = ["sdist", "wheel"]},
    {path = "model_zoo/Volo/model", format = ["sdist", "wheel"]},
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = ["*.ipynb", "model_zoo"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.coverage.run]
source = ["famous_vits"]
branch = true

[build-system]
requires = ["poetry-core>=2.0,<3.0"]
build-backend = "poetry.core.masonry.api"
